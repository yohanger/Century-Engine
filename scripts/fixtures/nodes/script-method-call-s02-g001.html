<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Century — métodos entre Scripts de Nodo S02</title></head>
<body><pre id="script-method-call-s02-g001-result">Comprobando…</pre>
<script type="module">
import * as THREE from 'three'
import { nodesMethods } from '/src/engine/runtime/events/play-nodes.js'
import { NodeLifecycle } from '/src/engine/runtime/scene/node-lifecycle.js'
import { NodeScriptRuntime } from '/src/engine/runtime/scene/node-scripts.js'
import { registerNode } from '/src/engine/runtime/nodes/registry.js'
registerNode({type:'s02ElectronNode',label:'QA S02',create:()=>({}),build:()=>({}),update:()=>{}})
const out=document.getElementById('script-method-call-s02-g001-result'),checks=[]
const check=(name,ok)=>{checks.push({name,pass:!!ok});if(!ok)throw Error(name)}
let renderer
const obj=(id,scriptId)=>({id,name:id,parentId:null,type:'s02ElectronNode',scriptId})
const src=(id,code)=>({id,execution:'node',code})
try {
  renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(16,16)
  const threeScene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,1,.1,10);camera.position.z=2
  threeScene.add(new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.3),new THREE.MeshBasicMaterial({color:0x6688ff})))
  renderer.render(threeScene,camera)
  check('WebGL2 real',renderer.capabilities.isWebGL2)
  const a=obj('a','s'),b=obj('b','s')
  const project={objects:[a,b],scripts:[src('s',`let count=0;node.expose('inc',(n=1)=>count+=n);node.expose('async',async()=>node.id);node.expose('error',()=>{throw Error('propagado')});function _ready(){game.record('ready:'+node.id)}`)]}
  const nodes=new Map(),events=[],errors=[]
  for(const o of project.objects){const n=new THREE.Group();n._lfNodeOwner=o;threeScene.add(n);nodes.set(o.id,n)}
  const scene={nodes,host:{project}},life=new NodeLifecycle(scene)
  const p={on:true,_referenceSession:{},project,ed:{nodes,nodeLifecycle:life},game:{api:{record:(value)=>events.push(value)},report:(e)=>errors.push(e.message)},
    pos:new THREE.Vector3(),vp:{requestRender(){}},vm:{held:new Map()},_tagLayerApi:()=>({}),_animMethodsFor:()=>({}),_persistMarked:()=>false,_persistSet:()=>false}
  Object.assign(p,nodesMethods);p.game.api.node=(name)=>p._nodeHandle(name)
  life.scripts=new NodeScriptRuntime(p);life.start()
  check('ready scripts',events.join(',')==='ready:a,ready:b')
  const h=p._nodeHandle('a'),other=p.game.api.node('b')
  check('método público a',h.call('inc',2)===2)
  check('método público b independiente',other.call('inc',4)===4)
  check('estado aislado',h.call('inc',1)===3)
  check('get_node script',h.get_node('.')?.id==='a')
  check('sin exponer handle global',h.expose===undefined)
  let missing=false;try{h.call('privado')}catch(e){missing=/no encontrado/.test(e.message)}
  check('privado inaccesible',missing)
  check('retorno Promise',await other.call('async')==='b')
  let rejected=false;try{h.call('error')}catch(e){rejected=/propagado/.test(e.message)}
  check('excepción propagada',rejected)
  const old=h
  const replacement=obj('a','s');project.objects=[replacement,b]
  const oldThree=nodes.get('a');threeScene.remove(oldThree)
  const freshThree=new THREE.Group();freshThree._lfNodeOwner=replacement;nodes.set('a',freshThree);threeScene.add(freshThree)
  life.sync()
  check('anterior inválido',!old.is_valid())
  check('nuevo válido',p._nodeHandle('a').is_valid())
  check('nueva instancia',p._nodeHandle('a').call('inc',1)===1)
  check('sin retargeting',(()=>{try{old.call('inc');return false}catch{return true}})())
  check('callbacks sin fugas',life.scripts.instances.size===2)
  life.stop();p.on=false;p._referenceSession=null
  check('Stop limpia scripts',life.scripts.instances.size===0)
  check('Stop invalida handle',!p._nodeHandle('b')?.is_valid?.())
  check('sin error GL',renderer.getContext().getError()===renderer.getContext().NO_ERROR)
  check('sin errores de scripts',errors.length===0)
  out.dataset.pass='true';out.textContent=JSON.stringify({pass:true,gl:renderer.getContext().getParameter(renderer.getContext().VERSION),checks},null,2)
}catch(error){out.dataset.pass='false';out.textContent=JSON.stringify({pass:false,error:String(error.stack||error),checks},null,2)}finally{renderer?.dispose()}
</script></body></html>
