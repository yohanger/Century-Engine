<!doctype html><meta charset="utf-8"><title>Century · Calidad del cielo especializado</title><div id="stage" style="width:480px;height:270px"></div><pre id="sky-variants-result">Preparando…</pre>
<script type="module">
import * as THREE from 'three'
import {Viewport} from '/src/engine/runtime/render/viewport.js'
import {astroTextures,applyAstro} from '/src/engine/runtime/render/astro-sky.js'
const checks=[], comparisons=[],errors=[],out=document.querySelector('#sky-variants-result')
const check=(name,pass,detail)=>{checks.push({name,pass:!!pass,detail});out.dataset.stage=name;if(!pass)throw Error(name)}
const wait=ms=>new Promise(r=>setTimeout(r,ms))
let vp,target,volume,map,pano
try{
 vp=new Viewport(document.querySelector('#stage'));cancelAnimationFrame(vp._raf);vp._ro.disconnect();clearTimeout(vp._bakeT)
 vp.renderer.debug.onShaderError=(gl,p,vs,fs)=>errors.push(gl.getProgramInfoLog(p)||gl.getShaderInfoLog(fs))
 const r=vp.renderer,gl=r.getContext(),u=vp.skyMat.uniforms
 vp._ensureCloudNoise()
 const n=24,depth=16,data=new Uint8Array(n*n*depth*2)
 for(let y=0;y<depth;y++)for(let z=0;z<n;z++)for(let x=0;x<n;x++){
  const k=((y*n+z)*n+x)*2,xx=(x-n*.5)/(n*.3),zz=(z-n*.5)/(n*.3),yy=(y-depth*.4)/(depth*.3)
  data[k]=Math.round(255*Math.max(0,1-xx*xx-zz*zz-yy*yy));data[k+1]=Math.round(255*Math.max(0,1-(xx-.15)**2-zz*zz-yy*yy))
 }
 volume=new THREE.Data3DTexture(data,n,n,depth);volume.format=THREE.RGFormat;volume.minFilter=volume.magFilter=THREE.LinearFilter;volume.needsUpdate=true
 const md=new Uint8Array(16*16*4);for(let i=0;i<md.length;i+=4){md[i]=180;md[i+1]=90;md[i+2]=10;md[i+3]=160}
 map=new THREE.DataTexture(md,16,16);map.minFilter=map.magFilter=THREE.LinearFilter;map.needsUpdate=true
 pano=new THREE.DataTexture(new Uint8Array([90,120,160,255,140,150,200,255]),2,1);pano.needsUpdate=true
 u.top.value.set('#3f74b8');u.horizon.value.set('#b9d3ec');u.ground.value.set('#5b5346')
 u.uSunDir.value.set(.4,.8,-.4).normalize();u.uSunColor.value.setRGB(1.2,1.1,1);u.uCAmb.value.setRGB(.3,.4,.5)
 u.uExposure.value=1;u.uTurb.value=2;u.uRayleigh.value=1;u.uMie.value=.005;u.uMieG.value=.8;u.uCamY.value=2
 u.uClouds.value=1;u.uCloudSteps.value=56;u.uCBase.value=900;u.uCThick.value=1400;u.uCScale.value=1;u.uCErode.value=.5
 u.uCovg.value=.6;u.uCDens.value=1;u.uCType.value=.5;u.uCLight.value=1;u.uCTint.value.setRGB(1,1,1)
 u.uCVolume.value=volume;u.uCVolumeOrigin.value.set(0,0,900,1/1400);u.uCVolumeBlend.value=.5
 u.uCMap.value=map;u.uCMapHalf.value=4000;u.uCCells.value=1;u.uPano.value=pano
 vp.camera.position.set(0,2,0);vp.camera.rotation.set(.45,0,0);vp.camera.updateMatrixWorld(true)
 target=new THREE.WebGLRenderTarget(480,270,{type:THREE.HalfFloatType})
 const scene=new THREE.Scene(),mesh=new THREE.Mesh(vp.sky.geometry,vp.skyMat);mesh.frustumCulled=false;scene.add(mesh)
 function draw(material,buffer){mesh.material=material;mesh.position.copy(vp.camera.position);r.setRenderTarget(target);r.clear();r.render(scene,vp.camera);if(buffer)r.readRenderTargetPixels(target,0,0,480,270,buffer)}
 const a=new Uint16Array(480*270*4),b=new Uint16Array(a.length)
 async function compare(name){
  out.dataset.stage=name
  r.setRenderTarget(null)
  const start=performance.now();let material=vp.skyVariants.update()
  while(material===vp.skyMat&&performance.now()-start<20000){await wait(20);material=vp.skyVariants.update()}
  check(name+' · variante lista',material!==vp.skyMat,vp.perf.stats.extra.skyVariant)
  draw(vp.skyMat);draw(material);await wait(40);draw(vp.skyMat,a);draw(material,b)
  let max=0,sum=0,changed=0,nonzero=0
  for(let i=0;i<a.length;i++){const delta=Math.abs(THREE.DataUtils.fromHalfFloat(a[i])-THREE.DataUtils.fromHalfFloat(b[i]));if(delta)changed++;max=Math.max(max,delta);sum+=delta*delta;if(i%4!==3&&a[i])nonzero++}
  const detail={name,max,rmse:Math.sqrt(sum/a.length),changed,channels:a.length};comparisons.push(detail)
  check(name+' · imagen HDR conservada',nonzero>100&&Number.isFinite(max)&&max<=.004&&detail.rmse<=.0001,detail)
  check(name+' · GPU sin errores',gl.getError()===0)
 }
 check('driver ofrece compilación paralela',r.extensions.has('KHR_parallel_shader_compile'))
 await compare('día · volumen 3D')
 u.uCVolumeBlend.value=1;u.uTime.value+=2;await compare('movimiento · mezcla de condensado')
 u.uMode.value=1;await compare('cielo físico')
 u.uMode.value=2;await compare('panorama HDRI')
 u.uMode.value=0;u.uCVolumeOrigin.value.w=0;await compare('mapa atmosférico 2D')
 u.uCCells.value=0;await compare('nubes procedurales')
 u.uCCells.value=1;u.uCVolumeOrigin.value.w=1/1400
 u.uNight.value=1;u.uSunColor.value.setRGB(0,0,0);u.uMoonColor.value.setRGB(.05,.06,.09);u.uStars.value=1;u.uMoonVis.value=1
 applyAstro(u,{moonVis:1,moonDir:[0,.6,-.8]})
 const tex=astroTextures();u.uStarTex.value=tex.stars;u.uStarOff.value=tex.off;u.uAstro.value=1;u.uLat.value=.35;u.uLst.value=.5
 await compare('noche · luna y estrellas reales')
 u.uTornadoCloud.value.set(0,-1400,250,.8);u.uTornadoShape.value.set(0,900,.9,.6);u.uTornadoOrganization.value.set(0,-1400,1800,.7)
 await compare('tornado · organización y condensación')
 check('caché limitada',vp.skyVariants.entries.size<=8)
 check('compilación sin errores GLSL',errors.length===0,errors)
 out.dataset.pass='true';out.textContent=JSON.stringify({pass:true,checks,comparisons,gl:gl.getParameter(gl.VERSION)})
}catch(error){out.dataset.pass='false';out.textContent=JSON.stringify({pass:false,error:String(error.stack),checks,comparisons,errors})}
finally{target?.dispose();volume?.dispose();map?.dispose();pano?.dispose();vp?.dispose()}
</script>
