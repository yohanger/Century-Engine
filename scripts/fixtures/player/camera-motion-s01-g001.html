<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Century Player Camera Motion QA</title></head><body style="margin:0;background:#112030;color:#eee;font-family:monospace">
<div id="view" style="height:256px;width:384px"></div><pre id="player-camera-motion-s01-g001-result">Comprobando…</pre>
<script type="module">
import * as THREE from 'three'
import {cameraMotionMethods} from '/src/engine/runtime/player/fps/camera-motion.js'
import {cameraShakeMethods} from '/src/engine/runtime/events/play-camera-shake.js'
import {normalizePlayer} from '/src/engine/runtime/database/player.js'
const checks=[],result=document.getElementById('player-camera-motion-s01-g001-result')
const check=(name,valid)=>{checks.push({name,pass:!!valid});if(!valid)throw Error(name)}
let renderer
try {
 renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true})
 renderer.setSize(384,256)
 document.getElementById('view').append(renderer.domElement)
 const gl=renderer.getContext()
 check('WebGL2 soportado',renderer.capabilities.isWebGL2)
 const scene=new THREE.Scene();scene.background=new THREE.Color('#1d354e')
 const box=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:'#e8c28f'}));scene.add(box)
 const cam=new THREE.PerspectiveCamera(72,384/256,.1,20);cam.position.set(0,0,4)
 renderer.render(scene,cam)
 const p0=Array.from(gl.readPixels?(()=>{const out=new Uint8Array(4);gl.readPixels(192,128,1,1,gl.RGBA,gl.UNSIGNED_BYTE,out);return out})():[])
 const cfg=normalizePlayer({cameraMotionEnabled:true,cameraMotionWalk:'bob',cameraMotionWalkGain:1,cameraMotionSmoothing:20})
 const p={play:{hasPlayer:true,control:true,paused:false,game:{db:{player:cfg}},g:cfg},pos:{x:0,y:0,z:0},prev:{x:0,y:0,z:0},vy:0,grounded:true,gk:'stable',wet:{swim:false}}
 Object.setPrototypeOf(p,cameraMotionMethods)
 const node={id:'bob',type:'cameraShake',visible:true,props:{camera:'player',enabled:true,autoPlay:false,loop:true,pattern:'sine',position:[.2,.02,0],rotation:[0,0,1.5],frequency:1,positionPhase:[90,0,0],blendIn:0,blendOut:0}}
 const w=Object.assign(Object.create(cameraShakeMethods),{player:p,hasPlayer:true,project:{objects:[node],animations:[]},state:{focus:true},paused:false,film:null,tls:[],_shakeClocks:new Map(),_mainCameraNode:()=>null})
 w._shakeFrame(cam,1/60);check('reposo estable sin transformación',cam.position.distanceTo(new THREE.Vector3(0,0,4))<1e-8)
 for(let i=0;i<20;i++){p.prev.x=p.pos.x;p.pos.x+=.07;p._cameraMotionTick(1/60)}
 check('estado caminar activado por distancia',p.cameraMotion.gain.Walk>.5)
 w._shakeFrame(cam,1/60)
 check('Camera Shake Base mueve cámara visualmente',Math.abs(cam.position.x)>.01)
 check('posición física del jugador sin cambio de renderer',p.pos.x>1.3)
 renderer.render(scene,cam)
 const pixel=new Uint8Array(4);gl.readPixels(192,128,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel)
 check('render produce píxeles opacos',pixel[3]===255)
 check('escena sigue renderizando con movimiento',gl.getError()===gl.NO_ERROR)
 w._shakeRestore(cam)
 check('pose original restaurada antes de física',cam.position.distanceTo(new THREE.Vector3(0,0,4))<1e-7)
 check('rotación original restaurada',cam.quaternion.angleTo(new THREE.Quaternion())<1e-7)
 p.play.game.db.player.cameraMotionEnabled=false;p._cameraMotionTick(1/60)
 check('apagar opción limpia efectos',p.cameraMotion===null)
 w._shakeFrame(cam,1/60)
 check('sin movimiento adicional al desactivar',cam.position.distanceTo(new THREE.Vector3(0,0,4))<1e-7)
 check('sin activación manual de recetas en relojes de script',w._shakeClocks.size===0)
 check('el contexto WebGL no genera errores',gl.getError()===gl.NO_ERROR)
 result.dataset.pass='true';result.textContent=JSON.stringify({pass:true,checks,gl:gl.getParameter(gl.VERSION)},null,2)
}catch(e){result.dataset.pass='false';result.textContent=JSON.stringify({pass:false,checks,error:String(e.stack||e)},null,2)}
finally{renderer?.dispose()}
</script></body></html>
