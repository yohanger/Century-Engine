<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Century · QA oclusión estática</title>
  <style>body { background: #181a1e; color: #efeff1; } #viewport { width: 640px; height: 360px; } #inspector { width: 280px; }</style>
</head>
<body>
  <div id="viewport"></div>
  <div id="inspector"></div>
  <div id="settings"></div>
  <pre id="static-occlusion-result">Ejecutando…</pre>
  <script type="module">
    import * as THREE from 'three'
    import { createApp, nextTick } from 'vue'
    import { Editor } from '/src/core/editor.js'
    import { createProjectData, splitProject } from '/src/core/project.js'
    import { redo, resetHistory, setEditor, setRenderMethod, store, undo } from '/src/core/store.js'
    import { occlusionBake } from '/src/core/state/occlusion.js'
    import GameSettingsModal from '/src/components/GameSettingsModal.vue'
    import Inspector from '/src/components/Inspector.vue'
    import { makeObject } from '/src/engine/runtime/nodes/index.js'
    import { SceneGraph } from '/src/engine/runtime/scene-graph.js'
    import { Terrain } from '/src/engine/runtime/geometry/terrain.js'
    import { cellAt } from '/src/engine/runtime/render/camera-occlusion.js'
    import { createPackageHost } from '/src/engine/runtime/package/host.js'
    import { readPackage, writePackage } from '/src/engine/runtime/package/format.js'
    import '/src/styles.css'

    const output = document.querySelector('#static-occlusion-result')
    const checks = []
    const check = (name, condition) => {
      checks.push({ name, pass: !!condition })
      output.dataset.stage = name
      if (!condition) throw new Error(name)
    }
    const findButton = (text) => [...document.querySelectorAll('button')].find(button => button.textContent.trim() === text)
    const findToggle = () => [...document.querySelectorAll('label')].find(label => label.textContent.includes('Activar oclusión precalculada'))?.querySelector('input')
    const primitive = (id, position, scale, isStatic = true, kind = 'box') =>
      makeObject('primitive', kind, { id, position, scale, props: { static: isStatic } })
    let graph, runtime, packageHost, settings, inspector
    try {
      const project = createProjectData('Oclusión estática')
      project.terrain.enabled = false
      project.objects = [
        primitive('wall', [0, 1, 0], [10, 12, 0.5], false),
        primitive('exposed', [12.5, 1, -4], [1, 1, 1], true, 'sphere'),
        primitive('dynamic', [0, 1, -3], [1, 1, 1], false),
        ...Array.from({ length: 24 }, (_, index) =>
          primitive('hidden-' + index, [(index % 6) - 2.5, 1, -4 - Math.floor(index / 6) * 1.5], [0.8, 0.8, 0.8], true, 'sphere')),
      ]
      store.locked = false
      store.project = project
      store.selectedId = 'wall'
      store.selectedIds = ['wall']
      const container = document.querySelector('#viewport')
      graph = new Editor(container)
      setEditor(graph)
      const blank = new Terrain(64, 8, project.terrain.layers)
      blank.enabled = false
      await graph.loadScene({ terrain: blank.serialize(), settings: project.settings })
      blank.dispose()
      graph.syncAll()
      graph.syncEnvironment()
      resetHistory()
      inspector = createApp(Inspector)
      inspector.mount('#inspector')
      await nextTick()
      document.querySelector('[data-testid="node-occlusion-static"]')?.click()
      check('El Inspector marca un nodo real como estático', store.project.objects[0].props.static === true)

      settings = createApp(GameSettingsModal)
      settings.mount('#settings')
      await nextTick()
      findButton('Render').click()
      await nextTick()
      const toggle = findToggle()
      check('El ajuste está en su propia sección de Render y empieza apagado', toggle && !toggle.checked &&
        toggle.closest('section').querySelector('h3')?.textContent === 'Oclusión estática')
      toggle.click()
      check('Activación persistente en el estado del proyecto', store.project.render.staticOcclusion === true)
      findButton('Hornear escena en GPU').click()
      const started = performance.now()
      while (occlusionBake.running && performance.now() - started < 20000) await new Promise(resolve => setTimeout(resolve, 40))
      check('El horneado terminó', !occlusionBake.running)
      const data = store.project.environment.occlusionBake
      check('El shader WebGL generó descartes', data?.covered > 0)
      check('El horneado excluye el nodo dinámico', !data.meshes.some(entry => entry.id === 'dynamic'))
      check('Se puede volver a hornear desde el mismo panel', !!findButton('Volver a hornear escena'))
      const context = graph.vp.renderer.getContext()
      const info = context.getExtension('WEBGL_debug_renderer_info')
      const gpu = info ? context.getParameter(info.UNMASKED_RENDERER_WEBGL) : context.getParameter(context.RENDERER)
      check('Sin error WebGL', context.getError() === context.NO_ERROR)
      undo()
      check('Deshacer retira el último horneado', !store.project.environment.occlusionBake)
      redo()
      check('Rehacer devuelve los resultados', store.project.environment.occlusionBake?.covered === data.covered)

      const camera = new THREE.PerspectiveCamera(90, 640 / 360, 0.1, 100)
      camera.position.set(0, 1, 4)
      const cameraCell = cellAt(data.grid, ...camera.position)
      const hidden = data.cells[cameraCell]?.filter((_, index) => index % 2 === 0).map(i => data.meshes[i].id) || []
      check('La celda descarta las esferas detrás de la pared y conserva la esfera lateral',
        hidden.length >= 24 && !hidden.includes('exposed'))
      const renderer = graph.vp.renderer
      renderer.shadowMap.enabled = false
      const targetImage = new THREE.WebGLRenderTarget(128, 72)
      const draw = () => {
        const pixels = new Uint8Array(128 * 72 * 4)
        renderer.setRenderTarget(targetImage)
        try {
          graph.vp.occlusion.draw(camera, () => renderer.render(graph.vp.scene, camera))
          renderer.readRenderTargetPixels(targetImage, 0, 0, 128, 72, pixels)
          return { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, pixels }
        } finally {
          renderer.setRenderTarget(null)
        }
      }
      const on = draw()
      findToggle().click()
      await nextTick()
      const off = draw()
      targetImage.dispose()
      check('A/B conserva la imagen píxel por píxel', on.pixels.every((value, index) => value === off.pixels[index]))
      delete on.pixels
      delete off.pixels
      check('A/B reduce draw calls y triángulos', on.calls < off.calls && on.triangles < off.triangles)
      findToggle().click()
      setRenderMethod('compat')
      check('Compatibility mantiene la activación del proyecto', store.project.render.staticOcclusion === true)

      const terrain = graph.serializeTerrain()
      const { meta, scene } = splitProject(store.project, terrain)
      const sceneId = meta.activeSceneId
      const pkg = await readPackage(await writePackage({ data: meta, scenes: [{ id: sceneId, name: 'Prueba', data: scene }], files: new Map() }))
      check('El paquete entrega la opción y el horneado de la escena',
        pkg.game.render.staticOcclusion === true && (await pkg.scene(sceneId)).environment.occlusionBake.covered === data.covered)

      packageHost = createPackageHost({ pkg, storage: localStorage })
      runtime = new SceneGraph(container, packageHost)
      await packageHost.attach(runtime)
      const target = runtime.nodes.get('hidden-0').userData.visual.children[0]
      let hiddenInPlayerPass = false
      const originalDraw = runtime.vp.occlusion.draw.bind(runtime.vp.occlusion)
      runtime.vp.occlusion.draw = (activeCamera, render) => originalDraw(activeCamera, () => {
        hiddenInPlayerPass = target.visible === false
        return render()
      })
      runtime.vp.camera = camera
      runtime.vp.look.render()
      check('El Player monta el horneado y aplica la máscara en la pasada real', hiddenInPlayerPass)
      check('La visibilidad se restaura tras el dibujo del Player', target.visible === true)
      output.dataset.pass = 'true'
      output.textContent = JSON.stringify({ pass: true, gl: context.getParameter(context.VERSION), gpu, on, off, checks })
    } catch (error) {
      output.dataset.pass = 'false'
      output.textContent = JSON.stringify({ pass: false, error: String(error.stack || error), toasts: store.toasts, checks })
    } finally {
      runtime?.dispose()
      packageHost?.dispose()
      graph?.dispose()
      inspector?.unmount()
      settings?.unmount()
    }
  </script>
</body>
</html>
