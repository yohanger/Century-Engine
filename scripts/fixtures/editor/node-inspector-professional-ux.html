<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Inspector de nodos</title><style>#app{width:340px;height:650px}pre{white-space:pre-wrap}</style></head><body><div id="app"></div><pre id="node-inspector-professional-result">Cargando…</pre>
<script>
(() => {
  const out = document.getElementById('node-inspector-professional-result')
  const checks = []
  let stage = 'bootstrap', finished = false
  const progress = next => {
    if (finished) return
    stage = next
    out.dataset.stage = stage
    out.dataset.checks = String(checks.length)
    out.textContent = JSON.stringify({stage, checks}, null, 2)
  }
  const finish = (pass, error) => {
    if (finished && (!error || out.dataset.pass === 'false')) return
    finished = true
    out.dataset.pass = String(pass)
    out.textContent = JSON.stringify({pass, stage, checks, ...(error ? {error:String(error.stack || error)} : {gl:'Inspector Vue / DOM'})}, null, 2)
  }
  const fail = error => finish(false, error || 'Error sin detalle')
  window.addEventListener('error', event => {
    if (event.error || event.message) fail(event.error || `${event.message} (${event.filename}:${event.lineno}:${event.colno})`)
    else if (event.target?.tagName === 'SCRIPT') fail(`No se pudo cargar el script: ${event.target.src || '(inline)'}`)
  }, true)
  window.addEventListener('unhandledrejection', event => fail(event.reason))
  window.__nodeInspectorQA = {checks, progress, finish, fail}
  progress('bootstrap')
})()
</script>
<script type="module">

 check('Posición, rotación y tamaño XYZ coloreados',colored(all('[data-fold-id=transform] .v3 .lbl')))
 const x=q('[data-fold-id=transform] .v3 input');x.focus();x.value='2.5';x.dispatchEvent(new Event('input',{bubbles:true}));x.blur();await tick();check('Transformación X usa valor y commit existentes',node('cube').position[0]===2.5&&node('cube').position[1]===0&&node('cube').position[2]===0)
 undo();await tick();check('Undo transformación',node('cube').position[0]===0)

 check('Material local esférico sin tarjeta redundante',!!q('[data-testid=node-material-heading] .mr-sphere')&&!q('.mr-resource')&&!q('.mr-actions'))
 q('[data-testid=node-material-menu]').click();await tick();check('Menú nativo conserva acciones',store.menu?.items.some(i=>i.label==='Guardar como recurso…')&&store.menu.items.some(i=>i.label==='Hacer local')&&!store.menu.items.some(i=>i.label==='Restaurar original'))
 store.menu=null;await tick();
 const script=q('.node-script-add select');check('Un selector de script sin botón duplicado',!!script&&!q('[data-fold-id=scripts] button.wide'))

 const pass=checks.length === 15 && checks.every(c=>c.pass);finish(pass,pass?undefined:Error('Comprobaciones incompletas'))
} catch(error){fail(error)}
finally{try{cancelPendingAutosave?.();app?.unmount()}catch(error){fail(error)}}
</script></body></html>
