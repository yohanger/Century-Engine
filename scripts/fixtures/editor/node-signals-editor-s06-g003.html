<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Century S06-G003 · Inspector Signals</title></head>
<body><main id="qa-ui" style="height:580px;max-width:315px"></main><pre id="node-signals-editor-s06-g003-result">Ejecutando QA del Inspector…</pre>
<script type="module">
import { createApp, nextTick } from 'vue'
import * as THREE from 'three'
import Panel from '/src/components/SignalConnectionsPanel.vue'
import { store } from '/src/core/store.js'
import { resetHistory, undo, redo } from '/src/core/state/history.js'
const checks=[];const check=(name,value)=>{checks.push({name,pass:!!value});if(!value)throw Error(name)}
const out=document.getElementById('node-signals-editor-s06-g003-result')
let app,renderer
const click=(selector)=>{const el=document.querySelector(selector);if(!el)throw Error('Elemento no encontrado: '+selector);el.click()}
const field=async(selector,value)=>{const e=document.querySelector(selector);if(!e)throw Error(selector);e.value=value;e.dispatchEvent(new Event(e.tagName==='SELECT'?'change':'input',{bubbles:true}));await nextTick()}
try {
 renderer = new THREE.WebGLRenderer({antialias:false});renderer.setSize(16,16)
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(70,1,.1,10);cam.position.z=2
 sc.add(new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.3),new THREE.MeshBasicMaterial({color:0x98a9b7})));renderer.render(sc,cam)
 check('WebGL2 con Electron',renderer.capabilities.isWebGL2)
 store.project={id:'qa',name:'QA',activeSceneId:'uno',scenes:[],objects:[{id:'a',name:'AreaDetector',type:'area3d'},{id:'b',name:'Puerta',type:'node3d',scriptId:'scriptb'}],
  signalConnections:[],materials:[],profiles:[],gameManagers:[],timelines:[],captures:[],assets:[],models:[],render:{},audio:{},environment:{},terrain:{enabled:false,layers:[],foliage:[]}}
 store.locked=false;store.selectedId='a';store.selectedIds=['a'];store.sceneSel=false;store.projSel=null;store.play.on=false
 store.editor={snapshotTerrain:()=>({enabled:false,layers:[],foliage:[]}),syncAll(){},syncEnvironment(){},setSelection(){},restoreEdit(){},afterUndo(){},setCaptureClips(){},player:{on:false}}
 resetHistory();app=createApp(Panel);app.mount('#qa-ui');await nextTick()
 check('Panel real montado',!!document.querySelector('[data-testid="signal-connections-panel"]'))
 check('Catálogo Area3D',document.body.textContent.includes('body_entered')&&document.body.textContent.includes('area_exited'))
 click('.sig-new');await nextTick()
 check('Diálogo accesible',!!document.querySelector('[role="dialog"][aria-modal="true"]'))
 await field('#lf-sig-name','body_entered');document.querySelectorAll('.sig-receiver-row')[1].click();await nextTick();await field('#lf-sig-method','abrir')
 click('.sig-dialog button[type="submit"]');await nextTick()
 check('Conexión guardada en escena',store.project.signalConnections.length===1&&store.project.signalConnections[0].method==='abrir')
 check('Conexión no ejecutada en edición',store.editor.player.on===false)
 check('Estado editorial',document.querySelector('.sig-link')?.textContent.includes('Registrada'))
 click('.sig-link button[title="Editar"]');await nextTick()
 await field('#lf-sig-method','cerrar');click('.sig-dialog button[type="submit"]');await nextTick()
 check('Edición del método',store.project.signalConnections[0].method==='cerrar')
 undo();await nextTick();check('Undo restaura método',store.project.signalConnections[0].method==='abrir')
 redo();await nextTick();check('Redo restaura edición',store.project.signalConnections[0].method==='cerrar')
 store.editor.player.on=true;store.editor.nodeLifecycle={scripts:{sceneConnections:new Map([[store.project.signalConnections[0].id,{}]]),sceneConnectionErrors:new Map()}}
 store.play.on=true;await nextTick()
 check('Activa solo con evidencia runtime',document.body.textContent.includes('Activa en Play'))
 check('Edición bloqueada en Play',!document.querySelector('.sig-new'))
 store.play.on=false;store.editor.player.on=false;await nextTick()
 click('.sig-link button[title="Desconectar"]');await nextTick()
 check('Desconexión con historial',store.project.signalConnections.length===0)
 undo();await nextTick();check('Undo restaurar desconexión',store.project.signalConnections.length===1)
 store.selectedId=null;store.selectedIds=[];await nextTick()
 check('Sin selección',document.body.textContent.includes('Selecciona un único nodo'))
 check('Sin error WebGL',renderer.getContext().getError()===renderer.getContext().NO_ERROR)
 out.dataset.pass='true';out.textContent=JSON.stringify({pass:true,gl:renderer.getContext().getParameter(renderer.getContext().VERSION),checks},null,2)
} catch(error) {out.dataset.pass='false';out.textContent=JSON.stringify({pass:false,error:String(error.stack||error),checks},null,2)}
finally {try{app?.unmount()}catch{}renderer?.dispose()}
</script></body></html>
