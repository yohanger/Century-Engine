<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Century · API e inteligencia</title></head><body>
<pre id="documentation-api-result">Ejecutando…</pre><div id="qa"></div>
<script type="module">
import { createApp, nextTick } from 'vue'
import { EditorView } from '@codemirror/view'
import { startCompletion, currentCompletions, completionStatus } from '@codemirror/autocomplete'
import { store } from '/src/core/store.js'
import { createProjectData } from '/src/core/project.js'
import { floatDockPanel } from '/src/core/editor/docking.js'
import ScriptEditor from '/src/components/ScriptEditor.vue'
import '/src/styles.css'
const out=document.querySelector('#documentation-api-result'),checks=[]
const check=(name,pass,detail='')=>{checks.push({name,pass:!!pass,detail});if(!pass)throw new Error(name+': '+detail)}
const tick=async()=>{await nextTick();await new Promise(requestAnimationFrame);await nextTick()}
const before={project:store.project,modal:store.modal,id:store.scriptEditId,mode:store.ui.mode,layout:store.prefs.dockLayout}
let app
try {
 store.ui.mode='desktop';store.project=createProjectData('API QA')
 store.project.scripts=[{id:'physical',name:'Physical.js',folder:'Assets',execution:'node',code:'node.'},{id:'generic',name:'Generic.js',folder:'Assets',execution:'node',code:'node.'}]
 store.project.objects=[{id:'actor',name:'Actor',type:'characterbody3d',scriptIds:['physical']},{id:'cube',name:'Cube',type:'primitive',scriptIds:['generic']}]
 store.scriptEditId='physical';store.modal='script';store.prefs.dockLayout=floatDockPanel(store.prefs.dockLayout,'scriptEditor',{x:25,y:45,w:820,h:520})
 app=createApp(ScriptEditor);app.mount('#qa');await tick()
 const view=()=>EditorView.findFromDOM(document.querySelector('.edwin.se .cm-editor'))
 const complete=async()=>{const v=view();if(!v)throw Error('CodeMirror ausente');v.dispatch({selection:{anchor:v.state.doc.length}});v.focus();startCompletion(v);for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,40));if(completionStatus(v.state)==='active')return currentCompletions(v.state).map(x=>x.label)}return []}
 check('Script Editor real montado',!!view())
 let options=await complete();check('Propietario CharacterBody3D sugiere velocity',options.includes('velocity'),JSON.stringify(options));check('Persistencia disponible',options.includes('keepOnLoad'))
 document.querySelectorAll('.se-file').forEach(el=>{if(el.textContent.includes('Generic.js'))el.click()});await tick();check('Cambio real de recurso',store.scriptEditId==='generic')
 options=await complete();check('Nodo genérico no sugiere velocity',!options.includes('velocity')&&options.includes('keepOnLoad'),JSON.stringify(options))
 check('CodeMirror único',document.querySelectorAll('.edwin.se .cm-editor').length===1)
 out.dataset.pass='true';out.textContent=JSON.stringify({pass:true,gl:'CodeMirror y Vue en Electron',checks},null,2)
}catch(e){out.dataset.pass='false';out.textContent=JSON.stringify({pass:false,checks,error:String(e.stack||e)},null,2)}
finally{app?.unmount();store.project=before.project;store.modal=before.modal;store.scriptEditId=before.id;store.ui.mode=before.mode;store.prefs.dockLayout=before.layout}
</script></body></html>
