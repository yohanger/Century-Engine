<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Century Camera Continuous Grab QA</title></head>
<body style="margin:0;background:#1b2635"><pre id="camera-continuous-grab-g001-result">Comprobando...</pre><div id="vp-parent" style="position:relative;width:320px;height:240px"></div>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js'
import { ContinuousGrab } from '/src/core/editor/continuous-grab.js'
import { navMethods } from '/src/engine/runtime/render/viewport-nav.js'
const out=document.querySelector('#camera-continuous-grab-g001-result'),checks=[]
const check=(name,pass,info='')=>{checks.push({name,pass:!!pass,info});if(!pass)throw Error(`${name}: ${JSON.stringify(info)}`)}
let renderer,controls,grab,nav
const prevLock=Object.getOwnPropertyDescriptor(document,'pointerLockElement'), prevExit=document.exitPointerLock
try {
  renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(320,240)
  const parent=document.querySelector('#vp-parent'),canvas=renderer.domElement;parent.appendChild(canvas)
  const camera=new THREE.PerspectiveCamera(60,320/240,.1,100);camera.position.set(4,5,8)
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x192739)
  scene.add(new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0xacc9d6})))
  controls=new OrbitControls(camera,canvas)
  controls.target.set(0,0,0);controls.update()
  controls.mouseButtons={LEFT:-1,MIDDLE:THREE.MOUSE.ROTATE,RIGHT:-1}
  renderer.render(scene,camera)
  check('WebGL2 y OrbitControls oficial disponibles',renderer.capabilities.isWebGL2 && controls.enabled)
  let locked=false,exits=0
  Object.defineProperty(document,'pointerLockElement',{configurable:true,get:()=>locked?canvas:null})
  canvas.requestPointerLock=()=>{locked=true;document.dispatchEvent(new Event('pointerlockchange'))}
  document.exitPointerLock=()=>{exits++;locked=false;document.dispatchEvent(new Event('pointerlockchange'))}
  canvas.setPointerCapture=()=>{}
  canvas.releasePointerCapture=()=>{}
  grab=new ContinuousGrab(canvas)
  let mode='edit'
  nav=Object.assign({dom:canvas,container:parent,camera,controls,playing:false,_flying:false,_space:false,isOrtho:false,
    orbitAroundSelection:false,currentView:null,requestRender(){},_flyLook:1,_keys:new Set(),_flyDist:10},navMethods)
  nav.setEditNavigation(()=>mode !== 'play',grab);nav._bindContinuousNavigation()
  const down=(button,opts={})=>canvas.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,button,buttons:button===1?4:button===2?2:1,pointerId:1,clientX:310,clientY:200,...opts}))
  const move=(dx,dy)=>{const e=new PointerEvent('pointermove',{bubbles:true,cancelable:true,buttons:4,pointerId:1});Object.defineProperty(e,'movementX',{value:dx});Object.defineProperty(e,'movementY',{value:dy});canvas.dispatchEvent(e)}
  const up=(button)=>canvas.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,button,buttons:0,pointerId:1}))
  mode='object';down(0);check('Object Mode conserva clic izquierdo normal',!grab.active);up(0)
  down(1);check('Object Mode reutiliza el cursor virtual',grab.active && grab.locked);up(1)
  mode='edit';down(1);check('Edit Mode conserva el mismo cursor virtual',grab.active && grab.locked)
  const before=camera.position.clone()
  move(80,40);check('OrbitControls real: navegación usa deltas relativos',camera.position.distanceTo(before)>0.001)
  for(let i=0;i<5;i++)move(150,-90)
  check('cruces continuos no generan NaN',camera.position.toArray().every(Number.isFinite) && grab.visual.x>=1 && grab.visual.x<319)
  check('cursor se muestra durante navegación',grab.cursor.style.display==='block')
  up(1);check('pointerup libera bloqueo y cursor',!grab.active && !locked && grab.cursor.style.display==='none')
  down(1,{shiftKey:true});const startTarget=controls.target.clone();move(40,-15)
  check('Shift+MMB desplaza target sin cambiar distancia cámara-objetivo',controls.target.distanceTo(startTarget)>0.001)
  up(1)
  down(0,{altKey:true});check('Alt+LMB inicia navegación existente',grab.active)
  up(0)
  down(2,{shiftKey:true});move(30,20);check('Shift+RMB aplica desplazamiento',grab.active);up(2)
  down(1);document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}))
  check('Escape cancela y suelta bloqueo',!grab.active && !locked)
  down(1);window.dispatchEvent(new Event('blur'))
  check('pérdida de foco libera cursor',!grab.active && !locked)
  mode='play';nav.playing=true;down(1);check('Play no captura navegación de Editor',!grab.active);up(1);nav.playing=false
  check('las capturas terminan sin dejar recursos activos',exits>=5 && !nav._continuousNavigation)

  mode = 'edit'
  nav.nav = 'trackpad'
  nav._padState = { ox: 0, oy: 0, px: 0, py: 0, z: 0, lastEv: 0, zoomUntil: 0, holdUntil: 0 }
  controls.enableZoom = false
  nav._bindFly()
  controls.target.set(0, 0, 0)
  camera.position.set(0, 1, 10)
  controls.update()
  const trackpad = (deltaY, shiftKey = false) => {
    const event = new WheelEvent('wheel', { deltaY, shiftKey, cancelable: true })
    canvas.dispatchEvent(event)
    for (let i = 1; i <= 12; i++) nav._padStep(0.05, event.timeStamp + i * 50)
  }
  trackpad(120)
  check('Trackpad en Edit Mode cruza por debajo del horizonte', camera.position.y < controls.target.y - 1)
  trackpad(-220)
  check('Trackpad puede volver por encima del horizonte', camera.position.y > controls.target.y + 1)
  const pivot = controls.target.clone()
  const offset = camera.position.clone().sub(pivot)
  trackpad(100, true)
  check('Shift y dos dedos desplazan la vista sin cambiar el ángulo',
    controls.target.distanceTo(pivot) > 0.1 && camera.position.clone().sub(controls.target).distanceTo(offset) < 1e-7)

  renderer.render(scene,camera);check('GL sin errores tras rotación y desplazamiento',renderer.getContext().getError()===renderer.getContext().NO_ERROR)
  out.dataset.pass='true';out.textContent=JSON.stringify({pass:true,checks,gl:renderer.getContext().getParameter(renderer.getContext().VERSION)},null,2)
}catch(err){out.dataset.pass='false';out.textContent=JSON.stringify({pass:false,checks,error:String(err?.stack||err)},null,2)}
finally{nav?._stopContinuousNavigation(true);nav?._continuousNavigationCleanup?.();nav?._flyCleanup?.();grab?.dispose();controls?.dispose();renderer?.dispose();Object.defineProperty(document,'pointerLockElement',prevLock||{configurable:true,value:null});document.exitPointerLock=prevExit}
</script></body></html>
