<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>LF tornado/nubes S01 WebGL</title></head><body>
<pre id="natural-s01-result">Iniciando comprobación...</pre>
<script type="module">
import * as THREE from 'three'
import { SKY_VERT, SKY_FRAG } from '/src/engine/runtime/render/skylib.js'
import { World } from '/src/engine/runtime/world/world.js'
import { buildShape, buildDetail } from '/src/engine/runtime/render/cloudnoise.js'
const output=document.querySelector('#natural-s01-result'), checks=[]
const check=(name,ok,details='')=>{checks.push({name,pass:!!ok,details});if(!ok)throw new Error(`${name}: ${JSON.stringify(details)}`)}
let renderer,skyMat,texture,detail,mapTexture
const shaderDiagnostics=[]
try {
  renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true})
  renderer.debug.onShaderError=(gl,program,vertexShader,fragmentShader)=>{
    shaderDiagnostics.push({program:gl.getProgramInfoLog(program),vertex:gl.getShaderInfoLog(vertexShader),fragment:gl.getShaderInfoLog(fragmentShader)})
  }
  renderer.setSize(128,128);renderer.setPixelRatio(1)
  check('WebGL2 (nubes 3D)',renderer.capabilities.isWebGL2)
  const make3D=(bytes,n)=>{
    const tex=new THREE.Data3DTexture(bytes,n,n,n)
    tex.format=THREE.RGBAFormat;tex.type=THREE.UnsignedByteType
    tex.minFilter=tex.magFilter=THREE.LinearFilter
    tex.wrapS=tex.wrapT=tex.wrapR=THREE.RepeatWrapping;tex.unpackAlignment=1;tex.needsUpdate=true
    return tex
  }
  texture=make3D(buildShape(24),24)
  detail=make3D(buildDetail(16),16)
  const u=(v)=>({value:v})
  const uniforms={
    top:u(new THREE.Color('#39485b')),horizon:u(new THREE.Color('#8b9197')),ground:u(new THREE.Color('#777777')),
    uMode:u(0),uExposure:u(1),uRotation:u(0),uTint:u(new THREE.Color('white')),
    uPano:u(null),uPanoFlip:u(0),uTurb:u(2),uRayleigh:u(1),uMie:u(0.005),uMieG:u(0.8),
    uSunDir:u(new THREE.Vector3(0.2,0.7,0.4).normalize()),uSunColor:u(new THREE.Color('#a9b3bf')),
    uClouds:u(1),uCloudSteps:u(24),uCovg:u(0.75),uCDens:u(1.2),uCBase:u(900),uCThick:u(2600),
    uCScale:u(0.65),uCErode:u(0.4),uCType:u(1),uShape:u(texture),uDetail:u(detail),
    uCCells:u(0),uCMap:u(null),uCCam:u(new THREE.Vector2()),uCAtm:u(new THREE.Vector2()),uCMapHalf:u(12000),
    uTornadoCloud:u(new THREE.Vector4(0,-400,110,0)),uTornadoShape:u(new THREE.Vector4(0,900,0,1)),uTornadoOrganization:u(new THREE.Vector4(0,-400,900,0)),uCamXZ:u(new THREE.Vector2(0,0)),
    uCWind:u(0),uCWindDir:u(0),uWindOff:u(new THREE.Vector2()),uTime:u(19),uCamY:u(100),
    uCLight:u(0.7),uCTint:u(new THREE.Color('#6b7385')),uCAmb:u(new THREE.Color('#3f4855')),
    uStars:u(0),uMoonVis:u(0),uFlash:u(0),uAstro:u(0),uLat:u(0),uLst:u(0),
    uStarCore:u(0.72),uStarTex:u(null),uStarOff:u(null),uMoonTex:u(null),
    uPlDir:u(Array.from({length:5},()=>new THREE.Vector3(0,-1,0))),uPlCol:u(Array.from({length:5},()=>new THREE.Vector4())),uPlRad:u([0,0,0,0,0]),
    uMoonDir:u(new THREE.Vector3(0,1,0)),uStarAxis:u(new THREE.Vector3(0,1,0)),uStarAng:u(0),
    uMoonRight:u(new THREE.Vector3(1,0,0)),uMoonUp:u(new THREE.Vector3(0,1,0)),uAstroSun:u(new THREE.Vector3(0,1,0)),uMoonIllum:u(1),uMoonRad:u(0.0122),
  }
  const skyScene=new THREE.Scene()
  skyMat=new THREE.ShaderMaterial({vertexShader:SKY_VERT,fragmentShader:SKY_FRAG,
    side:THREE.BackSide,depthWrite:false,uniforms})
  const sphere=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),skyMat)
  skyScene.add(sphere)
  const cam=new THREE.PerspectiveCamera(68,1,0.1,2000)
  cam.position.set(0,100,0);cam.lookAt(0,900,-400)
  sphere.position.copy(cam.position)
  const capture=()=>{
    renderer.render(skyScene,cam)
    const ctx=renderer.getContext(),pixels=new Uint8Array(128*128*4)
    ctx.readPixels(0,0,128,128,ctx.RGBA,ctx.UNSIGNED_BYTE,pixels)
    const glError=ctx.getError()
    check('sin errores GPU',glError===ctx.NO_ERROR,{code:glError,glsl:shaderDiagnostics})
    return pixels
  }
  const difference=(a,b)=>{let sum=0;for(let i=0;i<a.length;i+=4)sum+=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);return sum}
  const before=capture()
  check('cielo sin otros objetos',skyScene.children.length===1)
  uniforms.uTornadoOrganization.value.w=0.9
  const organized=capture(),classicDelta=difference(before,organized)
  check('classic: la nube cambia realmente de píxeles antes del embudo',classicDelta>0,{classicDelta})
  check('organización no dibuja embudo prematuro',uniforms.uTornadoShape.value.z===0 && uniforms.uTornadoCloud.value.w===0)
  uniforms.uTornadoOrganization.value.w=0
  const cleared=capture()
  check('classic: al terminar vuelve exactamente al cielo previo',difference(before,cleared)===0,{delta:difference(before,cleared)})

  const world=new World(41).configure({weather:{on:true,preset:'storm',cloudModel:'cells',cloudSeed:231,
    tornadoEnabled:true,tornadoMode:'script',tornadoDevelopmentSeconds:3,tornadoOrganizationSeconds:3}})
  world.startTornado({weatherTransition:0});world.tornadoStep(5.5);world.update(0.5);world.frame()
  const t=world.tornado, cf=world.field, M=cf.map
  check('cells: nube madre vinculada a una clave del campo real',t.motherKey===cf._worldKey(t.motherSx,t.motherSz))
  check('cells: mapa de nubes real disponible',M.version>0 && M.hasClouds)
  mapTexture=new THREE.DataTexture(M.data,M.N,M.N,THREE.RGBAFormat,THREE.UnsignedByteType)
  mapTexture.wrapS=mapTexture.wrapT=THREE.ClampToEdgeWrapping
  mapTexture.magFilter=mapTexture.minFilter=THREE.LinearFilter
  mapTexture.generateMipmaps=false;mapTexture.flipY=false;mapTexture.needsUpdate=true
  const pos=cf._horizontalOf(t.motherSx,t.motherSz)
  cam.position.set(pos[0],100,pos[1]+400);cam.lookAt(pos[0],900,pos[1])
  cam.updateProjectionMatrix();sphere.position.copy(cam.position)
  uniforms.uCamXZ.value.set(cam.position.x,cam.position.z)
  uniforms.uCCells.value=1;uniforms.uCMap.value=mapTexture
  uniforms.uCMapHalf.value=M.half
  uniforms.uCCam.value.set(cam.position.x-cf.windOff[0]-M.cx,cam.position.z-cf.windOff[1]-M.cz)
  const P=3125*uniforms.uCScale.value
  uniforms.uCAtm.value.set(((cam.position.x-cf.windOff[0])%P+P)%P,((cam.position.z-cf.windOff[1])%P+P)%P)
  uniforms.uCBase.value=M.slabBase;uniforms.uCThick.value=M.slabThick
  uniforms.uTornadoOrganization.value.set(pos[0],pos[1],1200,0)
  const cellBefore=capture()
  uniforms.uTornadoOrganization.value.w=0.98
  const cellAfter=capture(),cellsDelta=difference(cellBefore,cellAfter)
  check('cells: densidad existente se deforma, sin otro renderer',cellsDelta>0,{cellsDelta})
  uniforms.uTornadoOrganization.value.w=0
  check('cells: desactivar restaura exactamente el cielo',difference(cellBefore,capture())===0)
  check('sin partículas ni escenas añadidas',skyScene.children.length===1)
  check('World conserva la física independiente del shader',world.tornado.radius>0 && !world.tornado.active)
  output.dataset.classicDelta=String(classicDelta)
  output.dataset.cellsDelta=String(cellsDelta)
  output.dataset.pass='true'
  output.textContent=JSON.stringify({pass:true,checks,gl:renderer.getContext().getParameter(renderer.getContext().VERSION)},null,2)
} catch(e){output.dataset.pass='false';output.textContent=JSON.stringify({pass:false,checks,error:String(e.stack||e)},null,2)}
finally{skyMat?.dispose();texture?.dispose();detail?.dispose();mapTexture?.dispose();renderer?.dispose()}
</script></body></html>
